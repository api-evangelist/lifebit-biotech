apis:
- aid: lifebit-biotech:cloudos-api
  name: Lifebit CloudOS API
  description: 'The REST API behind the Lifebit Platform (CloudOS): manage workspace
    projects, job queues, workflows/pipelines, Nextflow and Cromwell/WDL job
    submission and monitoring, interactive analysis sessions, and datasets/files
    across S3 and Azure Blob storage. Requests are scoped to a workspace with a
    teamId query parameter and authenticated with an apikey request header. Version
    prefixes /api/v1, /api/v2 and /api/v3 are in concurrent use. Lifebit does not
    publish an OpenAPI description; the operation surface catalogued here was
    derived from the first-party open-source client, cloudos-cli.'
