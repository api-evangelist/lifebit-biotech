aid: lifebit-biotech
name: Lifebit Biotech
description: 'Lifebit Biotech Ltd is a London-founded (2017) health-data infrastructure
  company that builds federated Trusted Research Environments (TREs) for population-scale
  biomedical research and sovereign health AI. Rather than centralising sensitive
  patient data, Lifebit sends compute to the data: analyses execute inside each
  participating custodian''s own infrastructure and every proposed output passes
  through an automated airlock (the "sixth safe") controlled by the data custodian
  rather than the vendor. The commercial platform, CloudOS, orchestrates Nextflow
  and WDL/Cromwell pipelines, interactive analysis sessions, projects, job queues
  and federated datasets, and exposes a REST API at https://cloudos.lifebit.ai/api
  (v1/v2/v3) authenticated with an apikey header. Lifebit publishes a first-party
  open-source Python client and command line interface, cloudos-cli, plus a GitHub
  Action wrapper. Product surface includes the federated TRE, Airlock Tower output
  disclosure control, an agentic federated TRE, AI-automated OMOP CDM v5.4
  harmonisation, federated learning, a trusted data lakehouse and a trusted data
  marketplace. Publicly disclosed deployments include Genomics England, the US NIH
  National Library of Medicine, CanPath, Singapore Synapxe, Boehringer Ingelheim,
  Flatiron Health and 23andMe.'
